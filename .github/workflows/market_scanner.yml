# ============================================================
# US Stock Scanner - يعمل كل 5 دقائق خلال جلسات السوق الأمريكية
# الجلسات: Premarket (4:00) → Regular (9:30-16:00) → Postmarket (حتى 20:00) ET
# يتوقف خارج هذه الساعات ويعود في يوم التداول التالي
# يرتبط مع: main.py
# ============================================================

name: US Market Scanner

on:
  schedule:
    # كل 5 دقائق، من الاثنين إلى الجمعة (UTC)
    # الفحص الفعلي لساعات السوق يتم داخل الـ job بتوقيت نيويورك
    - cron: '*/5 * * * 1-5'
  workflow_dispatch: # تشغيل يدوي عند الحاجة

permissions:
  contents: write # لحفظ alerts_history.json في المستودع

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # --------------------------------------------------
      # 1) التحقق من ساعات السوق (America/New_York)
      #    Premarket 04:00 → Postmarket 20:00
      # --------------------------------------------------
      - name: Check US market hours (ET)
        id: market
        run: |
          python3 - <<'EOF'
          from datetime import datetime, time
          try:
              from zoneinfo import ZoneInfo
          except ImportError:
              import pytz
              ZoneInfo = lambda x: pytz.timezone(x)

          now = datetime.now(ZoneInfo("America/New_York"))
          weekday = now.weekday()  # 0=Mon ... 6=Sun
          t = now.time()

          # عطلة نهاية الأسبوع
          if weekday >= 5:
              print(f"⏸️ Weekend ({now.strftime('%A %Y-%m-%d %H:%M %Z')}) — skipping")
              print("::set-output name=active::false")
              exit(0)

          # من 4:00 صباحاً حتى 8:00 مساءً بتوقيت نيويورك
          if time(4, 0) <= t <= time(20, 0):
              print(f"✅ Market hours active: {now.strftime('%A %Y-%m-%d %H:%M %Z')}")
              print("::set-output name=active::true")
          else:
              print(f"⏸️ Outside market hours ({now.strftime('%H:%M %Z')}) — skipping")
              print("::set-output name=active::false")
          EOF

      # --------------------------------------------------
      # 2) Checkout الكود
      # --------------------------------------------------
      - name: Checkout repository
        if: steps.market.outputs.active == 'true'
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 3) إعداد Python
      # --------------------------------------------------
      - name: Set up Python
        if: steps.market.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # --------------------------------------------------
      # 4) تثبيت المكتبات
      # --------------------------------------------------
      - name: Install dependencies
        if: steps.market.outputs.active == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      # --------------------------------------------------
      # 5) استعادة سجل التنبيهات (حتى لا يتكرر تنبيه بلا تغيّر)
      # --------------------------------------------------
      - name: Restore alerts history
        if: steps.market.outputs.active == 'true'
        uses: actions/cache/restore@v4
        with:
          path: alerts_history.json
          key: alerts-history-${{ github.run_id }}
          restore-keys: |
            alerts-history-

      # --------------------------------------------------
      # 6) تشغيل الماسح (main.py)
      # --------------------------------------------------
      - name: Run market scanner
        if: steps.market.outputs.active == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          # يدعم main.py أو us_stock_scanner.py
          if [ -f main.py ]; then
            python main.py
          elif [ -f us_stock_scanner.py ]; then
            python us_stock_scanner.py
          else
            echo "❌ لم يُعثر على main.py أو us_stock_scanner.py"
            exit 1
          fi

      # --------------------------------------------------
      # 7) حفظ سجل التنبيهات للتشغيل القادم
      # --------------------------------------------------
      - name: Save alerts history
        if: steps.market.outputs.active == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: alerts_history.json
          key: alerts-history-${{ github.run_id }}
