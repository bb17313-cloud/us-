# ============================================================
# US Stock Scanner - كل 5 دقائق خلال جلسات السوق الأمريكية
# Premarket 04:00 → Postmarket 20:00 ET | يتوقف خارجها
# ============================================================

name: US Market Scanner

on:
  schedule:
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check US market hours (ET)
        id: market
        run: |
          python3 - <<'EOF'
          import os
          from datetime import datetime, time
          try:
              from zoneinfo import ZoneInfo
          except ImportError:
              import pytz
              ZoneInfo = lambda x: pytz.timezone(x)

          now = datetime.now(ZoneInfo("America/New_York"))
          weekday = now.weekday()
          t = now.time()
          active = "false"

          if weekday >= 5:
              print(f"⏸️ Weekend ({now.strftime('%A %Y-%m-%d %H:%M %Z')}) — skipping")
          elif time(4, 0) <= t <= time(20, 0):
              print(f"✅ Market hours active: {now.strftime('%A %Y-%m-%d %H:%M %Z')}")
              active = "true"
          else:
              print(f"⏸️ Outside market hours ({now.strftime('%H:%M %Z')}) — skipping")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"active={active}\n")
          EOF

      - name: Checkout repository
        if: steps.market.outputs.active == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.market.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.market.outputs.active == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Restore alerts history
        if: steps.market.outputs.active == 'true'
        uses: actions/cache/restore@v4
        with:
          path: alerts_history.json
          key: alerts-history-${{ github.run_id }}
          restore-keys: |
            alerts-history-

      - name: Run market scanner
        if: steps.market.outputs.active == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -f main.py ]; then
            python main.py
          elif [ -f us_stock_scanner.py ]; then
            python us_stock_scanner.py
          else
            echo "❌ لم يُعثر على main.py أو us_stock_scanner.py"
            exit 1
          fi

      - name: Save alerts history
        if: steps.market.outputs.active == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: alerts_history.json
          key: alerts-history-${{ github.run_id }}
